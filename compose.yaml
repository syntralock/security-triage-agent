services:
  app:
    build:
      context: .
    environment:
      STA_ENVIRONMENT: development
      STA_LOG_FORMAT: json
      STA_LOG_LEVEL: INFO
    read_only: true
    init: true
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
