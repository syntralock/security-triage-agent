name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install project and development tools
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Check formatting
        run: python -m ruff format --check src tests scripts migrations

      - name: Lint
        run: python -m ruff check src tests scripts migrations

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Validate migrations
        run: python -m alembic upgrade head --sql >/dev/null

      - name: Validate synthetic fixtures
        run: PYTHONPATH=src python scripts/verify_fixtures.py fixtures/v1

      - name: Check dependency consistency
        run: python -m pip check

      - name: Static security analysis
        run: python -m bandit -c pyproject.toml -r src

      - name: Secret scan
        run: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline $(git ls-files --cached --others --exclude-standard)

      - name: Clean-install release smoke test
        run: bash scripts/release_smoke.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker compose build app

      - name: Run foundation smoke check
        run: docker compose run --rm --no-deps --entrypoint python app -m security_triage_agent --check
