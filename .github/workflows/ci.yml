name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy src tests

      - name: Test
        run: python -m pytest

      - name: Validate synthetic fixtures
        run: PYTHONPATH=src python scripts/verify_fixtures.py fixtures/v1

      - name: Check dependency consistency
        run: python -m pip check

      - name: Static security analysis
        run: python -m bandit -c pyproject.toml -r src

      - name: Secret scan
        run: python -m detect_secrets.pre_commit_hook --baseline .secrets.baseline $(git ls-files --cached --others --exclude-standard)

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build app

      - name: Run foundation smoke check
        run: docker compose run --rm --no-deps app --check
